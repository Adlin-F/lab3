<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <p><a href="/">← Back</a></p>
    <h1>Profile</h1>

    <div id="card" class="card">Loading...</div>

    <script>
      async function loadProfile() {
        const card = document.getElementById("card");
        const id = window.location.pathname.split("/").pop();

        try {
          const res = await fetch(`/api/profiles/${id}`);
          if (!res.ok) throw new Error(await res.text());

          const p = await res.json();

          card.innerHTML = `
            <h2>${p.name ?? ""}</h2>
            <p><b>Age:</b> ${p.age ?? ""}</p>
            <p><b>Bio:</b> ${p.bio ?? ""}</p>
            ${
              p.imageUrl
                ? `<img src="${p.imageUrl}" alt="Profile photo" style="max-width: 300px; margin-top: 12px;" />`
                : ""
            }
          `;
        } catch (err) {
          card.innerHTML = `<b>Error:</b> ${err?.message || err}`;
          console.error(err);
        }
      }

      loadProfile();
    </script>
  </body>
</html>
